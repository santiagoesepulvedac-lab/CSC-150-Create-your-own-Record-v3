<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Crusade Music Map</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

/* Background */

#map{
    position:relative;
    width:100%;
    height:100%;
    background-image:url("BG.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Hotspots */

.hotspot{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.75);
    background:rgba(255,255,255,.18);
    cursor:pointer;
    transition:.25s;
}

.hotspot:hover{
    transform:scale(1.15);
    background:rgba(255,255,255,.35);
}

.hotspot.active{
    background:gold;
    border-color:white;
    box-shadow:0 0 20px gold;
}

/* Label */

#songTitle{
    position:absolute;
    left:20px;
    bottom:20px;

    background:rgba(0,0,0,.6);
    color:white;
    padding:14px 20px;
    border-radius:8px;

    font-size:20px;
}
</style>

</head>
<body>

<div id="map">

    <!-- Placeholders -->

    <div class="hotspot"
         style="left:18%; top:25%;"
         data-song="The Third Crusade.mp3"
         data-title="The Third Crusade">
    </div>

    <div class="hotspot"
         style="left:40%; top:20%;"
         data-song="The Third Crusade.mp3"
         data-title="Song 2">
    </div>

    <div class="hotspot"
         style="left:70%; top:30%;"
         data-song="The Third Crusade.mp3"
         data-title="Song 3">
    </div>

    <div class="hotspot"
         style="left:32%; top:65%;"
         data-song="The Third Crusade.mp3"
         data-title="Song 4">
    </div>

    <div class="hotspot"
         style="left:76%; top:72%;"
         data-song="The Third Crusade.mp3"
         data-title="Song 5">
    </div>

    <div id="songTitle">
        Click a location to play music
    </div>

</div>

<audio id="player"></audio>

<script>

const player = document.getElementById("player");
const title = document.getElementById("songTitle");
const spots = document.querySelectorAll(".hotspot");

spots.forEach(spot=>{

    spot.addEventListener("click",()=>{

        // Remove previous highlight
        spots.forEach(s=>s.classList.remove("active"));

        // Highlight clicked one
        spot.classList.add("active");

        // Play music
        player.src = spot.dataset.song;
        player.play();

        // Update title
        title.textContent = "Now Playing: " + spot.dataset.title;

    });

});

player.addEventListener("ended",()=>{

    spots.forEach(s=>s.classList.remove("active"));
    title.textContent="Click a location to play music";

});

</script>

</body>
</html>
